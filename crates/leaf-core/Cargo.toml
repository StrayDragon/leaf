[package]
name = "leaf-core"
version = "0.1.0"
edition = "2021"
description = "Stable API facade for the leaf terminal Markdown rendering library"
license = "MIT"

[dependencies]
leaf = { path = "../.." }
ratatui = "0.30"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
anyhow = "1.0"
